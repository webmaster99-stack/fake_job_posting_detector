# Single source of truth for every tunable value in the pipeline.
# Changing anything here invalidates the dependent DVC stages.

seed: 42

datasets:
  - name: emscad
    path: data/raw/emscad.csv
    target: fraudulent

clean:
  # Rows whose normalized concatenation of these columns match are duplicates.
  dedupe_on: [title, company_profile, description, requirements, benefits]

split:
  # Approximate fractions: whole template groups move together (see src/fjd/data/groups.py).
  test_size: 0.15
  val_size: 0.15
  # Rows sharing the first `template_chars` letters of the description, or the same
  # company profile, form one group. Keys shorter than `min_key_chars` link nothing.
  template_chars: 300
  min_key_chars: 50

mlflow:
  experiment: fake-job-detector
  registered_model: fake-job-detector

selection:
  metric: pr_auc
  max_model_size_mb: 300
  max_p95_latency_ms: 300

features:
  # One TF-IDF over all text fields (title, company profile, description, requirements,
  # benefits), plus tabular features; see src/fjd/features/featurize.py.
  tfidf:
    max_features: 50000
    ngram_range: [1, 2]
    min_df: 3
    max_df: 0.9
    sublinear_tf: true
    strip_accents: unicode
  # Category values seen fewer times in train are merged into one "infrequent" column.
  categorical_min_frequency: 20

# Hyperparameters per classical model; one `train_classical` stage runs per key.
# Tuned with `uv run poe tune` / notebooks/03_classical_tuning.ipynb (records in reports/tuning/).
# Fixed settings (class weights, seeds, threads) live in src/fjd/models/classical.py.
classical:
  logreg:  # CV PR-AUC 0.5505
    C: 99.48164341217733
  linear_svm:  # CV PR-AUC 0.5581
    C: 1.0948615098992018
  naive_bayes:  # CV PR-AUC 0.4972
    alpha: 0.005158253919906371
    norm: false
  random_forest:  # CV PR-AUC 0.5495
    k_features: 1989
    max_depth: null
    max_features: sqrt
    min_samples_leaf: 1
    n_estimators: 800
  xgboost:  # CV PR-AUC 0.5413
    k_features: 2151
    learning_rate: 0.14741245945553266
    max_depth: 6
    min_child_weight: 0.6307448641259035
    n_estimators: 250
    reg_lambda: 0.001189320778867986
    scale_pos_weight: 7.981501200876971
  lightgbm:  # CV PR-AUC 0.5473
    colsample_bytree: 0.2672054756004693
    k_features: 2268
    learning_rate: 0.05657278186541099
    min_child_samples: 9
    n_estimators: 250
    num_leaves: 28
    reg_lambda: 0.06745485380358274
    scale_pos_weight: 3.0789191900789303
    subsample: 0.5723901410799077

tuning:
  cv_folds: 5  # StratifiedGroupKFold on group_id over the train split
  n_trials: 40

# DistilBERT fine-tuned on Colab (`train_transformer`, notebooks/04_transformer_colab.ipynb).
transformer:
  pretrained: distilbert/distilbert-base-uncased
  revision: 12040accade4e8a0f71eabdb258fecc2e7e948be  # pinned Hugging Face Hub commit
  max_length: 256  # tokens; latency grows with it
  # Words kept from each long field before tokenizing; see src/fjd/models/transformer.py.
  # About half the val postings then fit in max_length whole; the rest lose the end of their
  # benefits. (Budgets of 30/120/50/30 truncated 9 in 10 postings, mostly cutting benefits.)
  field_words:
    company_profile: 20
    description: 80
    requirements: 30
    benefits: 15
  epochs: 4  # the best epoch by val PR-AUC is kept
  batch_size: 32
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  fraud_weight: 1.0  # cross-entropy weight of the fraud class
  quantize: true  # int8 ONNX: ~4x smaller and faster on CPU
  latency_sample: 200  # val postings timed for the deployability check
  # A retrained model must match the committed val PR-AUC within this (GPU training isn't
  # bit-for-bit reproducible).
  repro_tolerance: 0.005
