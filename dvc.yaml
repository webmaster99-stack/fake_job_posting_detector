stages:
  ingest:
    cmd: python -m fjd.data.ingest
    deps:
      - src/fjd/data/ingest.py
      - src/fjd/data/io.py
      - src/fjd/utils/config.py
      - src/fjd/data/schema.py
      - data/raw/emscad.csv  # add one line per dataset in params.datasets
    params:
      - datasets
    outs:
      - data/interim/ingested.parquet

  validate:
    cmd: python -m fjd.data.validate
    deps:
      - src/fjd/data/validate.py
      - src/fjd/data/ingest.py
      - src/fjd/data/io.py
      - src/fjd/data/schema.py
      - src/fjd/utils/config.py
      - data/interim/ingested.parquet
    metrics:
      - reports/data_validation.json:
          cache: false

  clean_dedupe:
    cmd: python -m fjd.data.clean
    deps:
      - src/fjd/data/clean.py
      - src/fjd/data/ingest.py
      - src/fjd/data/io.py
      - src/fjd/data/schema.py
      - src/fjd/utils/config.py
      - data/interim/ingested.parquet
      - reports/data_validation.json  # only runs on validated data
    params:
      - clean
    outs:
      - data/interim/clean.parquet
    metrics:
      - reports/clean.json:
          cache: false

  split:
    cmd: python -m fjd.data.split
    deps:
      - src/fjd/data/split.py
      - src/fjd/data/groups.py
      - src/fjd/data/clean.py
      - src/fjd/data/ingest.py
      - src/fjd/data/io.py
      - src/fjd/data/schema.py
      - src/fjd/utils/config.py
      - src/fjd/utils/seed.py
      - data/interim/clean.parquet
    params:
      - seed
      - split
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
    metrics:
      - reports/split.json:
          cache: false

  featurize:
    cmd: python -m fjd.features.featurize
    deps:
      - src/fjd/features/featurize.py
      - src/fjd/features/build.py
      - src/fjd/data/io.py
      - src/fjd/data/schema.py
      - src/fjd/utils/config.py
      - src/fjd/utils/seed.py
      - data/processed/train.parquet
    params:
      - seed
      - features
    outs:
      - models/featurizer.joblib
    metrics:
      - reports/features.json:
          cache: false

  train_classical:
    foreach: ${classical}  # one stage per model in params.yaml
    do:
      cmd: python -m fjd.models.train ${key}
      deps:
        - src/fjd/models/train.py
        - src/fjd/models/classical.py
        - src/fjd/models/metrics.py
        - src/fjd/features/build.py  # unpickling the featurizer imports it
        - src/fjd/data/io.py
        - src/fjd/data/schema.py
        - src/fjd/utils/config.py
        - src/fjd/utils/seed.py
        - models/featurizer.joblib
        - data/processed/train.parquet
        - data/processed/val.parquet
      params:
        - seed
        - classical.${key}
      outs:
        - models/classical/${key}.joblib
        - models/classical/${key}.threshold.json
      metrics:
        - reports/train/${key}.json:
            cache: false

  train_transformer:
    # Fine-tunes DistilBERT on a GPU: run it on Colab with notebooks/04_transformer_colab.ipynb.
    # Frozen, so `dvc repro` never runs it (not even with -f) and uses the ONNX model pulled
    # from DVC. The notebook explains how to record a retrained model with `dvc commit`.
    frozen: true
    cmd: python -m fjd.models.train_transformer
    deps:
      - src/fjd/models/train_transformer.py
      - src/fjd/models/transformer.py
      - src/fjd/models/deployability.py
      - src/fjd/models/metrics.py
      - src/fjd/data/io.py
      - src/fjd/data/schema.py
      - src/fjd/utils/config.py
      - src/fjd/utils/seed.py
      - data/processed/train.parquet
      - data/processed/val.parquet
    params:
      - seed
      - transformer
      - selection
    outs:
      - models/transformer
    metrics:
      - reports/train/transformer.json:
          cache: false

  evaluate:
    cmd: python -m fjd.models.evaluate
    deps:
      - src/fjd/models/evaluate.py
      - src/fjd/models/train.py
      - src/fjd/models/classical.py
      - src/fjd/models/metrics.py
      - src/fjd/models/transformer.py
      - src/fjd/models/deployability.py
      - src/fjd/features/build.py
      - src/fjd/data/io.py
      - src/fjd/data/schema.py
      - src/fjd/utils/config.py
      - src/fjd/utils/plotting.py
      - src/fjd/utils/seed.py
      - src/fjd/utils/tracking.py
      - models/classical  # every train_classical output
      - models/transformer
      - reports/train
      - data/processed/val.parquet
      - data/processed/test.parquet
    params:
      - seed
      - features
      - classical
      - transformer
      - selection
      - mlflow
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - reports/plots/pr_curve:
          cache: false

  select_and_register:
    # Registers the best deployable model in MLflow as a new `@challenger` version.
    # Promotion to `@champion` is manual: `uv run poe promote`.
    cmd: python -m fjd.models.select
    deps:
      - src/fjd/models/select.py
      - src/fjd/models/registry.py
      - src/fjd/models/train.py
      - src/fjd/models/classical.py
      - src/fjd/models/metrics.py
      - src/fjd/models/transformer.py
      - src/fjd/models/deployability.py
      - src/fjd/features/build.py
      - src/fjd/data/io.py
      - src/fjd/data/schema.py
      - src/fjd/utils/config.py
      - src/fjd/utils/seed.py
      - src/fjd/utils/tracking.py
      - reports/metrics.json
      - models/classical
      - models/transformer
      - data/processed/val.parquet
      - data/processed/test.parquet
    params:
      - seed
      - selection
      - mlflow
    metrics:
      - reports/selection.json:
          cache: false

plots:
  - test_pr_curve:
      title: Precision-recall on the test split (fraud class)
      template: simple
      x: recall
      y:
        reports/plots/pr_curve/logreg.csv: precision
        reports/plots/pr_curve/linear_svm.csv: precision
        reports/plots/pr_curve/naive_bayes.csv: precision
        reports/plots/pr_curve/random_forest.csv: precision
        reports/plots/pr_curve/xgboost.csv: precision
        reports/plots/pr_curve/lightgbm.csv: precision
        reports/plots/pr_curve/transformer.csv: precision
