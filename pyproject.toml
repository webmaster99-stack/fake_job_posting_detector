[project]
name = "fjd"
version = "0.1.0"
description = "Fake job posting detector: ML pipeline, MLOps and serving."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "mlflow>=2.17",
    "dvc>=3.55",
    "pyarrow>=25.0.1",
    "matplotlib>=3.9",
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "nbstripout>=0.8",
    "poethepoet>=0.29",
    "types-pyyaml",
    "kaggle>=2.2.4",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "seaborn>=0.13",
]
transformer = [
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fjd"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]  # vendored third-party skills

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks]
lint = "ruff check ."
fmt = "ruff format ."
typecheck = "mypy src"
test = "pytest"
dvc-auth = "python -m fjd.utils.dvc_auth"
tune = "python -m fjd.models.tune"  # e.g. `uv run poe tune logreg --trials 20`
promote = "python -m fjd.models.promote"  # @challenger -> @champion, after a prompt
pull = "dvc pull"
repro = "dvc repro"
metrics = "dvc metrics show"
reproduce = ["pull", "repro", "metrics"]
