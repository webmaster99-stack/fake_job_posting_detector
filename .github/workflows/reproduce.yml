name: Reproduce

# The README's reproduction steps on a fresh clone of main, as a stranger would run them with
# their own DagsHub token: `dvc repro` after `dvc pull` must change nothing, and re-running every
# stage from scratch must give the committed metrics.
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce from a fresh clone
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run poe dvc-auth
      - run: uv run dvc pull
      - name: dvc repro is a no-op
        run: |
          uv run dvc repro
          uv run dvc status
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Re-run every stage
        run: uv run dvc repro --force
      - name: Check the committed metrics were reproduced
        run: uv run python -m fjd.utils.repro_check
